name: Branch Guard

on:
  pull_request:
    branches: [main]

jobs:
  check-source-branch:
    name: Verify source branch is develop
    runs-on: ubuntu-latest

    steps:
      - name: Block non-develop branches from merging into main
        if: github.head_ref != 'develop'
        run: |
          echo "::error::Only the 'develop' branch can be merged into main. Current source branch: '${{ github.head_ref }}'"
          exit 1

      - name: Source branch verified
        if: github.head_ref == 'develop'
        run: echo "Source branch is 'develop' — merge permitted."
